<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>لوحة إدارة Omar Tareeq</title>
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex, nofollow" />
<!-- PWA: يسمح للوحة الإدارة تتثبت كتطبيق على الموبايل/الديسكتوب -->
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="لوحة الإدارة" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  /* admin-only tweaks, kept minimal and in its own block so style.css stays shared with the student site */
  body{ padding-bottom:0 !important; }
  .site-header{ justify-content:flex-start; }
  .admin-shell{ max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  .admin-title-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .admin-title-row h1{ font-family:var(--font-display); font-weight:700; font-size:22px; margin:0; }
  .students-search{ margin-bottom:14px; }
  .students-search input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14.5px; background:var(--surface-2); }
  .students-search input:focus{ outline:none; border-color:var(--accent); background:#fff; }

  /* mobile consistency for the admin panel */
  @media (max-width: 640px){
    .admin-shell{ padding:16px 14px 50px; }
    .admin-title-row h1{ font-size:19px; }
    .tabs{ gap:2px; }
    .tab-btn{ padding:9px 10px; font-size:13px; }
    .row-item{ flex-direction:column; align-items:flex-start !important; gap:8px; }
    .row-actions{ width:100%; flex-wrap:wrap; }
    .row-actions .chip-btn{ flex:1 1 auto; text-align:center; }
    .option-row{ flex-wrap:wrap; }
    .option-row input[type="file"]{ width:100% !important; }
    .option-row input[type="text"]{ min-width:0; }
  }

  /* تسجيل الدخول ملغي — دخول تلقائي مباشرة للوحة الإدارة */
  .auth-view{ display:none !important; }
</style>
</head>
<body>

<!-- كونسول تظهر الأخطاء على الشاشة (مفيدة على الموبايل حيث مفيش Developer Tools) -->
<button id="onScreenConsoleToggle" style="position:fixed;bottom:14px;left:14px;z-index:999999;background:#1d1d1f;color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-family:sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);direction:ltr">
  Console <span id="onScreenConsoleBadge" style="display:none;background:#e0393e;border-radius:999px;padding:1px 7px;margin-inline-start:6px;font-size:11px"></span>
</button>
<div id="onScreenConsolePanel" style="display:none;position:fixed;inset:auto 0 0 0;height:55vh;z-index:999998;background:#0f0f10;color:#d8d8dc;font:12px/1.5 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;box-shadow:0 -4px 20px rgba(0,0,0,.4);">
  <div style="display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #2a2a2d;background:#161617">
    <strong style="font-family:sans-serif;font-size:12.5px">On-screen Console</strong>
    <div style="flex:1"></div>
    <button id="onScreenConsoleClear" style="background:#2a2a2d;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11.5px">Clear</button>
    <button id="onScreenConsoleClose" style="background:#2a2a2d;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11.5px">Close</button>
  </div>
  <div id="onScreenConsoleLog" style="overflow-y:auto;height:calc(100% - 42px);padding:8px 10px;white-space:pre-wrap;word-break:break-word"></div>
</div>
<script>
(function(){
  var logEl, badgeEl, panelEl, toggleBtn, errCount = 0;
  function ready(fn){ if (document.readyState !== "loading") fn(); else document.addEventListener("DOMContentLoaded", fn); }
  function fmt(args){
    return Array.prototype.map.call(args, function(a){
      if (a instanceof Error) return (a.stack || a.message || String(a));
      if (typeof a === "object"){ try{ return JSON.stringify(a); }catch(e){ return String(a); } }
      return String(a);
    }).join(" ");
  }
  function push(kind, text){
    if (!logEl) return;
    var colors = { log:"#d8d8dc", info:"#6cb6ff", warn:"#e6b955", error:"#ff6b6b" };
    var line = document.createElement("div");
    line.style.color = colors[kind] || colors.log;
    line.style.marginBottom = "4px";
    var time = new Date().toLocaleTimeString("en-GB");
    line.textContent = "[" + time + "] " + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    if (kind === "error" || kind === "warn"){
      errCount++;
      if (badgeEl){ badgeEl.style.display = "inline"; badgeEl.textContent = errCount; }
    }
  }
  ["log","info","warn","error"].forEach(function(kind){
    var original = console[kind] ? console[kind].bind(console) : function(){};
    console[kind] = function(){
      original.apply(console, arguments);
      push(kind, fmt(arguments));
    };
  });
  window.addEventListener("error", function(e){
    push("error", (e.message || "Script error") + " — " + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || ""));
  });
  // capture-phase listener: يمسك أخطاء تحميل الملفات نفسها (404 أو مسار غلط) اللي مش بتوصل لل window.onerror العادي
  window.addEventListener("error", function(e){
    var t = e.target;
    if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK" || t.tagName === "IMG")){
      push("error", "فشل تحميل الملف: " + (t.src || t.href || "") + " (تحقق من المسار/اسم الملف/حالة الأحرف)");
    }
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    var reason = e.reason;
    push("error", "Unhandled promise rejection: " + (reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason)));
  });
  // علامة تأكيد: لو app.js اتحمل واشتغل، هيحط window.__appJsLoaded = true من جوّاه.
  // لو بعد 5 ثواني لسه مش متحطة، يبقى الملف نفسه مش وصل للمتصفح.
  setTimeout(function(){
    if (!window.__appJsLoaded){
      push("error", "app.js لم يتم تحميله أو تنفيذه خلال 5 ثواني — تأكد إن الملف مرفوع بنفس الاسم (app.js بحروف صغيرة) في نفس مجلد index.html على GitHub Pages، وإن الديبلوي خلص");
    }
  }, 5000);
  ready(function(){
    logEl = document.getElementById("onScreenConsoleLog");
    badgeEl = document.getElementById("onScreenConsoleBadge");
    panelEl = document.getElementById("onScreenConsolePanel");
    toggleBtn = document.getElementById("onScreenConsoleToggle");
    toggleBtn.addEventListener("click", function(){
      panelEl.style.display = panelEl.style.display === "none" ? "block" : "none";
      if (panelEl.style.display === "block"){ errCount = 0; badgeEl.style.display = "none"; }
    });
    document.getElementById("onScreenConsoleClose").addEventListener("click", function(){ panelEl.style.display = "none"; });
    document.getElementById("onScreenConsoleClear").addEventListener("click", function(){ logEl.innerHTML = ""; });
  });
})();
</script>

<div id="app-loader" class="app-loader">
  <div class="loader-mark"><span style="font-family:var(--font-display);font-weight:700;font-size:15px">Omar Tareeq</span></div>
</div>

<header class="site-header">
  <div class="brand-mark" aria-label="Omar Tareeq"><span style="font-family:var(--font-display);font-weight:700;font-size:15px">لوحة الإدارة</span></div>
  <div class="header-spacer"></div>
  <div class="header-actions" id="headerActions">
    <span id="headerUserBox"></span>
    <button class="chip-btn" id="logoutBtn">خروج</button>
  </div>
</header>

<main id="auth-view" class="auth-view">

  <section class="auth-card" id="pinCard">
    <h1 class="auth-title">لوحة الإدارة</h1>
    <p class="auth-sub">أدخل الرمز السري للدخول</p>
    <form id="pinForm" class="auth-form" novalidate>
      <label class="field"><span>الرمز السري</span><input id="pinInput" type="password" inputmode="numeric" autocomplete="off" required autofocus /></label>
      <button type="submit" class="primary-btn">دخول</button>
    </form>
  </section>

</main>

<div id="authMsg" class="auth-msg" role="status" aria-live="polite"></div>

<div class="admin-shell hidden" id="adminShell">
  <div class="admin-title-row"><h1>لوحة الإدارة</h1></div>
  <div class="tabs" id="adminTabs"></div>
  <div id="adminPane"></div>
</div>

<script type="module" src="app.js"></script>
<script>
  /* PWA: تسجيل الـ service worker بدون التأثير على أي كود موجود في app.js */
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
