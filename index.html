<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>لوحة تحكم رقيم</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="https://i.ibb.co/3mG5jPZT/icon.png">

<style>
@font-face{font-family:'AppTitles';src:url('https://files.catbox.moe/fwgw08.otf') format('opentype');font-weight:700;font-display:swap;}
@font-face{font-family:'AppBody';src:url('https://files.catbox.moe/jernkn.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'AppSub';src:url('https://files.catbox.moe/gsv6s7.otf') format('opentype');font-weight:400;font-display:swap;}

:root{
  --canvas:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F6F3; --ink:#151510; --ink-soft:#6B6A60;
  --line:#EBE8E0; --emerald:#0E6B56; --emerald-soft:#0E6B5612; --gold:#C6A87D; --gold-soft:#C6A87D1c;
  --danger:#B23A34; --danger-soft:#B23A3414; --radius-lg:22px; --radius-md:14px; --radius-sm:10px;
  --shadow-soft:0 1px 2px rgba(21,20,15,.03), 0 10px 26px -12px rgba(21,20,15,.10);
  --shadow-lift:0 4px 8px rgba(21,20,15,.05), 0 22px 44px -16px rgba(21,20,15,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;}
html,body{margin:0; padding:0; background:var(--canvas); color:var(--ink); max-width:100%;}
body{overflow-x:hidden; font-family:'AppBody','SF Pro Arabic','Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; min-height:100dvh;}
h1,h2,h3,.title{font-family:'AppTitles','AppBody',sans-serif; font-weight:700; margin:0; letter-spacing:-.01em;}
label,.sub,.eyebrow{font-family:'AppSub','AppBody',sans-serif;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:100px; border:2px solid var(--canvas);}
*{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
.icon{width:17px; height:17px; display:inline-block; flex-shrink:0;}
.icon svg{width:100%; height:100%;}

.warn-banner{background:#FFF7E6; border-bottom:1px solid #F0DDA8; color:#7A5B10; font-size:12.5px; padding:9px 16px; text-align:center; line-height:1.7;}

.shell{display:flex; min-height:100dvh;}
.sidebar{width:230px; flex-shrink:0; border-left:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh; overflow-y:auto;}
.sidebar .brand{display:flex; align-items:center; gap:9px; padding:8px 10px 20px;}
.sidebar .brand img{width:28px; height:28px; border-radius:8px; filter:brightness(0);}
.sidebar .brand span{font-family:'AppTitles'; font-size:16px;}
.navbtn{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:none; background:transparent; text-align:right; cursor:pointer; color:var(--ink-soft); font-size:14px; font-family:inherit;}
.navbtn:hover{background:var(--surface-2);}
.navbtn.active{background:var(--emerald-soft); color:var(--emerald); font-weight:600;}
.content{flex:1; min-width:0; padding:26px 28px 60px;}
.content-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.content-head h1{font-size:22px;}
@media(max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; border-left:none; border-bottom:1px solid var(--line); padding:10px;}
  .sidebar .brand{display:none;}
  .navbtn{flex-shrink:0;}
  .content{padding:18px 16px 50px;}
}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:0 18px; border-radius:100px; border:1px solid transparent; font-size:14px; font-weight:590; cursor:pointer; transition:transform .12s ease, opacity .15s ease, background .15s ease; white-space:nowrap; font-family:inherit;}
.btn:active{transform:scale(.95); opacity:.85;}
.btn-primary{background:var(--emerald); color:#fff;}
.btn-ghost{background:var(--surface-2); color:var(--ink);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-gold{background:var(--gold); color:#241d10;}
.btn-sm{min-height:32px; padding:0 13px; font-size:12.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-soft); margin-bottom:22px;}
.panel h3{font-size:15.5px; margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=tel],.field input[type=url],.field textarea,.field select{
  width:100%; padding:10px 13px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--canvas);
  color:var(--ink); font-size:14px; font-family:inherit;
}
.field input[type=file]{width:100%; font-size:13px;}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.field-row .field{flex:1; min-width:160px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
img.preview{width:70px; height:70px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--line); margin-top:6px;}

table.rows{width:100%; border-collapse:collapse;}
table.rows th{text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
table.rows td{padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
table.rows tr:last-child td{border-bottom:none;}
.badge{display:inline-flex; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:600;}
.badge.pending{background:var(--gold-soft); color:#8a6d3b;}
.badge.approved,.badge.issued{background:var(--emerald-soft); color:var(--emerald);}
.badge.rejected{background:var(--danger-soft); color:var(--danger);}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.thumb-sm{width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--line);}

.qblock,.tblock{border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; background:var(--surface-2);}
.qblock .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.qblock .opt-row input[type=text]{flex:1;}
.qblock .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.tblock{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
.tblock textarea{flex:2; min-width:180px;}
.tblock select,.tblock input[type=color]{flex:0 0 auto;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--canvas); padding:12px 20px; border-radius:100px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow-lift);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.empty{text-align:center; padding:30px; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>

<div class="warn-banner">⚠️ لوحة التحكم دي مفتوحة من غير تسجيل دخول — أي حد معاه الرابط ده يقدر يعدّل قاعدة البيانات بالكامل. متشاركش الرابط مع حد، واعتبره سري زي كلمة السر.</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="https://i.ibb.co/NdFdqsQT/logo.png" alt="رقيم"><span>لوحة التحكم</span></div>
    <button class="navbtn active" data-tab="tracks">المسارات</button>
    <button class="navbtn" data-tab="courses">الدورات</button>
    <button class="navbtn" data-tab="lectures">المحاضرات</button>
    <button class="navbtn" data-tab="tasks">المهام والاختبارات</button>
    <button class="navbtn" data-tab="payments">المدفوعات</button>
    <button class="navbtn" data-tab="certificates">الشهادات</button>
    <button class="navbtn" data-tab="coupons">أكواد الخصم</button>
    <button class="navbtn" data-tab="users">المستخدمون</button>
  </aside>
  <main class="content" id="content"></main>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   CONFIG — same Firebase project as the main رقيم platform
   ===================================================================== */
const CONFIG = {
  FIREBASE_CONFIG: {
    apiKey: 'AIzaSyCTGnFOK7m_xNod8mwBPB5HTgTP2BrNm6o',
    authDomain: 'cyberintel-d0d4f.firebaseapp.com',
    projectId: 'cyberintel-d0d4f',
    storageBucket: 'cyberintel-d0d4f.appspot.com',
    messagingSenderId: '533279564815',
    appId: '1:533279564815:web:d373567c2be86311127af7a',
  },
  IMGBB_KEY: '36b0e2658ed6fad2ca48081442f1539b',
};
firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
const fbDb = firebase.firestore();

const DB = {
  async listAll(collection, whereField, whereValue){
    let ref = fbDb.collection(collection);
    if (whereField) ref = ref.where(whereField, '==', whereValue);
    const snap = await ref.get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async get(collection, id){
    const doc = await fbDb.collection(collection).doc(id).get();
    return doc.exists ? { id: doc.id, ...doc.data() } : null;
  },
  async create(collection, data, id){
    if (id) { await fbDb.collection(collection).doc(id).set(data); return { id }; }
    const ref = await fbDb.collection(collection).add(data);
    return { id: ref.id };
  },
  async update(collection, id, patch){
    await fbDb.collection(collection).doc(id).set(patch, { merge: true });
    return { id };
  },
  async remove(collection, id){
    await fbDb.collection(collection).doc(id).delete();
    return { id };
  },
};
function friendlyError(e){
  const code = e && (e.code || '');
  if (code === 'permission-denied') return 'لا يوجد صلاحية وصول — تحقّق من Firestore Rules (لازم تسمح بالكتابة من غير تسجيل دخول لهذه اللوحة)';
  if (code === 'not-found' || code === 'failed-precondition') return 'قاعدة بيانات Firestore غير موجودة لهذا المشروع بعد';
  console.error(e);
  return `حدث خطأ: ${code || (e && e.message) || 'غير معروف'}`;
}
const ImgBB = {
  async upload(file){
    const fd = new FormData(); fd.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${CONFIG.IMGBB_KEY}`, { method:'POST', body:fd });
    const json = await res.json();
    if (!json.success) throw new Error('ImgBB upload failed');
    return json.data.url;
  }
};
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function genCode(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = 'RQM-';
  for (let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

const ICONS = {
  book:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15.5"/></svg>`,
  edit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>`,
};
function icon(name){ return `<span class="icon">${ICONS[name]||''}</span>`; }

/* =====================================================================
   TABS / ROUTER
   ===================================================================== */
const content = document.getElementById('content');
let currentTab = 'tracks';
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentTab = b.dataset.tab; loadTab();
}));
async function loadTab(){
  content.innerHTML = `<div class="empty">...جارٍ التحميل</div>`;
  try {
    if (currentTab==='tracks') await renderTracksTab();
    else if (currentTab==='courses') await renderCoursesTab();
    else if (currentTab==='lectures') await renderLecturesTab();
    else if (currentTab==='tasks') await renderTasksTab();
    else if (currentTab==='payments') await renderPaymentsTab();
    else if (currentTab==='certificates') await renderCertificatesTab();
    else if (currentTab==='coupons') await renderCouponsTab();
    else if (currentTab==='users') await renderUsersTab();
  } catch(e){ content.innerHTML = `<div class="empty">${escapeHtml(friendlyError(e))}</div>`; }
}

/* =====================================================================
   TRACKS
   ===================================================================== */
async function renderTracksTab(){
  const tracks = await DB.listAll('Tracks');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} المسارات</h1></div>
    <div class="panel">
      <h3 id="trackFormTitle">إضافة مسار جديد</h3>
      <input type="hidden" id="trackEditId">
      <div class="field"><label>اسم المسار *</label><input type="text" id="trackName"></div>
      <div class="field"><label>الوصف</label><textarea id="trackDesc"></textarea></div>
      <div class="field"><label>أيقونة المسار</label><input type="file" accept="image/*" id="trackIcon"><img class="preview" id="trackIconPreview" style="display:none;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="trackSaveBtn">${icon('plus')} حفظ</button>
        <button class="btn btn-ghost" id="trackCancelBtn" style="display:none;">إلغاء التعديل</button>
      </div>
    </div>
    <div class="panel">
      <table class="rows"><thead><tr><th></th><th>الاسم</th><th>الوصف</th><th></th></tr></thead>
      <tbody id="tracksRows">${tracks.length ? tracks.map(t=>`
        <tr>
          <td>${t.icon_url?`<img class="thumb-sm" src="${escapeHtml(t.icon_url)}">`:''}</td>
          <td>${escapeHtml(t.name_ar||'')}</td>
          <td style="color:var(--ink-soft); font-size:12.5px;">${escapeHtml((t.description_ar||'').slice(0,60))}</td>
          <td class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="editTrack('${t.id}')">${icon('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTrack('${t.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="4" class="empty">لا توجد مسارات بعد</td></tr>`}</tbody></table>
    </div>`;
  document.getElementById('trackSaveBtn').addEventListener('click', saveTrack);
  document.getElementById('trackCancelBtn').addEventListener('click', ()=>renderTracksTab());
  window._tracksCache = tracks;
}
async function saveTrack(){
  const btn = document.getElementById('trackSaveBtn');
  const name_ar = document.getElementById('trackName').value.trim();
  if (!name_ar){ toast('اكتب اسم المسار'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    let icon_url;
    const file = document.getElementById('trackIcon').files[0];
    if (file) icon_url = await ImgBB.upload(file);
    const editId = document.getElementById('trackEditId').value;
    const data = { name_ar, description_ar: document.getElementById('trackDesc').value.trim() };
    if (icon_url) data.icon_url = icon_url;
    if (editId) await DB.update('Tracks', editId, data);
    else await DB.create('Tracks', data);
    toast('تم الحفظ بنجاح'); renderTracksTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editTrack(id){
  const t = (window._tracksCache||[]).find(x=>x.id===id); if (!t) return;
  document.getElementById('trackFormTitle').textContent = 'تعديل المسار';
  document.getElementById('trackEditId').value = id;
  document.getElementById('trackName').value = t.name_ar||'';
  document.getElementById('trackDesc').value = t.description_ar||'';
  if (t.icon_url){ const p=document.getElementById('trackIconPreview'); p.src=t.icon_url; p.style.display='block'; }
  document.getElementById('trackCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteTrack(id){
  if (!confirm('حذف هذا المسار؟ لن يحذف الدورات المرتبطة به تلقائيًا.')) return;
  try { await DB.remove('Tracks', id); toast('تم الحذف'); renderTracksTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   COURSES
   ===================================================================== */
async function renderCoursesTab(){
  const [courses, tracks] = await Promise.all([DB.listAll('Courses'), DB.listAll('Tracks')]);
  window._tracksCache = tracks; window._coursesCache = courses;
  const trackOptions = tracks.map(t=>`<option value="${t.id}">${escapeHtml(t.name_ar||'')}</option>`).join('');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} الدورات</h1></div>
    <div class="panel">
      <h3 id="courseFormTitle">إضافة دورة جديدة</h3>
      <input type="hidden" id="courseEditId">
      <div class="field-row">
        <div class="field"><label>المسار *</label><select id="courseTrack">${trackOptions || '<option value="">لا توجد مسارات — أضف مسارًا أولًا</option>'}</select></div>
        <div class="field"><label>اسم المحاضر</label><input type="text" id="courseInstructor"></div>
      </div>
      <div class="field"><label>عنوان الدورة *</label><input type="text" id="courseTitle"></div>
      <div class="field"><label>الوصف</label><textarea id="courseDesc"></textarea></div>
      <div class="field"><label>صورة الغلاف</label><input type="file" accept="image/*" id="courseCover"><img class="preview" id="courseCoverPreview" style="display:none;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="courseSaveBtn">${icon('plus')} حفظ</button>
        <button class="btn btn-ghost" id="courseCancelBtn" style="display:none;">إلغاء التعديل</button>
      </div>
    </div>
    <div class="panel">
      <table class="rows"><thead><tr><th></th><th>العنوان</th><th>المسار</th><th>المحاضر</th><th></th></tr></thead>
      <tbody>${courses.length ? courses.map(c=>`
        <tr>
          <td>${c.cover_image_url?`<img class="thumb-sm" src="${escapeHtml(c.cover_image_url)}">`:''}</td>
          <td>${escapeHtml(c.title_ar||'')}</td>
          <td style="color:var(--ink-soft); font-size:12.5px;">${escapeHtml((tracks.find(t=>t.id===c.track_id)||{}).name_ar||'—')}</td>
          <td style="color:var(--ink-soft); font-size:12.5px;">${escapeHtml(c.instructor_name||'')}</td>
          <td class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="editCourse('${c.id}')">${icon('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">لا توجد دورات بعد</td></tr>`}</tbody></table>
    </div>`;
  document.getElementById('courseSaveBtn').addEventListener('click', saveCourse);
  document.getElementById('courseCancelBtn').addEventListener('click', ()=>renderCoursesTab());
}
async function saveCourse(){
  const btn = document.getElementById('courseSaveBtn');
  const title_ar = document.getElementById('courseTitle').value.trim();
  const track_id = document.getElementById('courseTrack').value;
  if (!title_ar || !track_id){ toast('اختر المسار واكتب عنوان الدورة'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    let cover_image_url;
    const file = document.getElementById('courseCover').files[0];
    if (file) cover_image_url = await ImgBB.upload(file);
    const editId = document.getElementById('courseEditId').value;
    const data = { title_ar, track_id, instructor_name: document.getElementById('courseInstructor').value.trim(), description_ar: document.getElementById('courseDesc').value.trim() };
    if (cover_image_url) data.cover_image_url = cover_image_url;
    if (editId) await DB.update('Courses', editId, data);
    else await DB.create('Courses', data);
    toast('تم الحفظ بنجاح'); renderCoursesTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editCourse(id){
  const c = (window._coursesCache||[]).find(x=>x.id===id); if (!c) return;
  document.getElementById('courseFormTitle').textContent = 'تعديل الدورة';
  document.getElementById('courseEditId').value = id;
  document.getElementById('courseTrack').value = c.track_id||'';
  document.getElementById('courseInstructor').value = c.instructor_name||'';
  document.getElementById('courseTitle').value = c.title_ar||'';
  document.getElementById('courseDesc').value = c.description_ar||'';
  if (c.cover_image_url){ const p=document.getElementById('courseCoverPreview'); p.src=c.cover_image_url; p.style.display='block'; }
  document.getElementById('courseCancelBtn').style.display='inline-flex';

function addTextBlock(block){

function renderTextBlocks(){
  const host = document.getElementById('textBlocksHost');

function addQuizQuestion(q){
  const question = q || { q:'', options:['','',''].map(()=>''), correct:0 };

}
function renderQuizQuestions(){
  const host = document.getElementById('quizQuestionsHost');
  host.innerHTML = quizQuestions.map((q,qi)=>`
    <div class="qblock">
      <div class="qhead">
        <strong style="font-size:13px;">سؤال ${qi+1}</strong>
        <button class="btn btn-danger btn-sm" onclick="removeQuizQuestion(${qi})">${icon('trash')}</button>
      </div>
      <div class="field"><input type="text" placeholder="نص السؤال" value="${escapeHtml(q.q)}" oninput="quizQuestions[${qi}].q=this.value"></div>
      ${q.options.map((opt,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correct-${qi}" ${q.correct===oi?'checked':''} onchange="quizQuestions[${qi}].correct=${oi}">
          <input type="text" placeholder="اختيار ${oi+1}" value="${escapeHtml(opt)}" oninput="quizQuestions[${qi}].options[${oi}]=this.value">
          <button class="btn btn-ghost btn-sm" onclick="removeQuizOption(${qi},${oi})">${icon('trash')}</button>
        </div>`).join('')}
      <button class="btn btn-ghost btn-sm" onclick="addQuizOption(${qi})">${icon('plus')} إضافة اختيار</button>
    </div>`).join('') || `<div class="hint">لا توجد أسئلة بعد</div>`;
}
function removeQuizQuestion(i){ quizQuestions.splice(i,1); renderQuizQuestions(); }
function addQuizOption(qi){ quizQuestions[qi].options.push(''); renderQuizQuestions(); }
function removeQuizOption(qi,oi){
  quizQuestions[qi].options.splice(oi,1);
  if (quizQuestions[qi].correct >= quizQuestions[qi].options.length) quizQuestions[qi].correct = 0;
  renderQuizQuestions();
}
async function saveTask(){
  const btn = document.getElementById('taskSaveBtn');
  const title_ar = document.getElementById('taskTitle').value.trim();
  const lecture_id = document.getElementById('taskLecture').value;
  const type = document.getElementById('taskType').value;
  if (!title_ar || !lecture_id){ toast('اختر المحاضرة واكتب عنوان المهمة'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    const data = { title_ar, lecture_id, type, order: Number(document.getElementById('taskOrder').value)||1 };
    if (['video','audio','pdf'].includes(type)){
      data.content_url = document.getElementById('taskContentUrl').value.trim();
      data.content_json = firebase.firestore.FieldValue.delete();
      data.quiz_data = firebase.firestore.FieldValue.delete();
    } else if (type==='text'){
      if (!textBlocks.length){ toast('أضف جزء نص واحد على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = textBlocks.map(b=>({ text:b.text, color:b.color, animation:b.animation||'' }));
      data.content_url = firebase.firestore.FieldValue.delete();
      data.quiz_data = firebase.firestore.FieldValue.delete();
    } else if (type==='quiz'){
      if (!quizQuestions.length){ toast('أضف سؤال واحد على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.quiz_data = {
        questions: quizQuestions.map(q=>({ q:q.q, options:q.options, correct:q.correct })),
        time_limit_minutes: Number(document.getElementById('quizTimeLimit').value)||10,
        max_attempts: Number(document.getElementById('quizMaxAttempts').value)||3,
        pass_percent: Number(document.getElementById('quizPassPercent').value)||75,
      };
      data.content_url = firebase.firestore.FieldValue.delete();
      data.content_json = firebase.firestore.FieldValue.delete();
    }
    const editId = document.getElementById('taskEditId').value;
    if (editId) await DB.update('Tasks', editId, data);
    else await DB.create('Tasks', data);
    toast('تم الحفظ بنجاح'); renderTasksTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editTask(id){
  const t = (window._tasksCache||[]).find(x=>x.id===id); if (!t) return;
  document.getElementById('taskFormTitle').textContent = 'تعديل المهمة';
  document.getElementById('taskEditId').value = id;
  document.getElementById('taskLecture').value = t.lecture_id||'';
  document.getElementById('taskOrder').value = t.order||1;
  document.getElementById('taskType').value = t.type||'video';
  document.getElementById('taskTitle').value = t.title_ar||'';
  document.getElementById('taskContentUrl').value = t.content_url||'';
  onTaskTypeChange();
  textBlocks = Array.isArray(t.content_json) ? t.content_json.map(b=>({...b})) : [];
  renderTextBlocks();
  quizQuestions = (t.quiz_data && Array.isArray(t.quiz_data.questions)) ? t.quiz_data.questions.map(q=>({...q, options:[...q.options]})) : [];
  renderQuizQuestions();
  if (t.quiz_data){
    document.getElementById('quizTimeLimit').value = t.quiz_data.time_limit_minutes||10;
    document.getElementById('quizMaxAttempts').value = t.quiz_data.max_attempts||3;
    document.getElementById('quizPassPercent').value = t.quiz_data.pass_percent||75;
  }
  document.getElementById('taskCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteTask(id){
  if (!confirm('حذف هذه المهمة؟')) return;
  try { await DB.remove('Tasks', id); toast('تم الحذف'); renderTasksTab(); } catch(e){ toast(friendlyError(e)); }
}

    };
    if (file_url) data.file_url = file_url;
    if (editId) await DB.update('Certificates', editId, data);
    else await DB.create('Certificates', data);
    toast('تم الحفظ بنجاح'); renderCertificatesTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editCert(id){
  const c = (window._certsCache||[]).find(x=>x.id===id); if (!c) return;
  document.getElementById('certFormTitle').textContent = 'تعديل الشهادة';
  document.getElementById('certEditId').value = id;
  document.getElementById('certEmail').value = c.user_email||'';
  document.getElementById('certCourse').value = c.course_id||'';
  document.getElementById('certName').value = c.full_name_ar||'';
  document.getElementById('certLang').value = c.language||'ar';
  document.getElementById('certStatus').value = c.status||'pending';
  document.getElementById('certCode').value = c.verify_code||genCode();
  if (c.file_url){ const p=document.getElementById('certFilePreview'); p.src=c.file_url; p.style.display='block'; }
  document.getElementById('certCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteCert(id){
  if (!confirm('حذف هذه الشهادة؟')) return;
  try { await DB.remove('Certificates', id); toast('تم الحذف'); renderCertificatesTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   COUPONS
   ===================================================================== */
async function renderCouponsTab(){
  const [coupons, courses] = await Promise.all([DB.listAll('Coupons'), DB.listAll('Courses')]);
  window._couponsCache = coupons; window._coursesCache = courses;
  const courseOptions = `<option value="">كل الدورات</option>` + courses.map(c=>`<option value="${c.id}">${escapeHtml(c.title_ar||'')}</option>`).join('');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} أكواد الخصم</h1></div>
    <div class="panel">
      <h3>إضافة كود جديد</h3>
      <div class="field-row">
        <div class="field"><label>الكود *</label><input type="text" id="couponCode" style="text-transform:uppercase;"></div>
        <div class="field" style="max-width:140px;"><label>نسبة الخصم %</label><input type="number" id="couponDiscount" value="10" min="1" max="100"></div>
        <div class="field" style="max-width:140px;"><label>عدد الاستخدامات</label><input type="number" id="couponUses" value="50" min="1"></div>
      </div>
      <div class="field"><label>مخصص لدورة</label><select id="couponCourse">${courseOptions}</select></div>
      <button class="btn btn-primary" id="couponSaveBtn">${icon('plus')} حفظ</button>
    </div>
    <div class="panel">
      <table class="rows"><thead><tr><th>الكود</th><th>الخصم</th><th>الدورة</th><th>متبقٍ</th><th>مفعّل</th><th></th></tr></thead>
      <tbody>${coupons.length ? coupons.map(c=>`
        <tr>
          <td style="font-family:monospace;">${escapeHtml(c.id)}</td>
          <td>${c.discount_percent||0}%</td>
          <td style="font-size:12.5px;">${escapeHtml((courses.find(x=>x.id===c.course_id)||{}).title_ar||'الكل')}</td>
          <td>${c.uses_left ?? 0}</td>
          <td><span class="badge ${c.active==='TRUE'||c.active===true ?'approved':'rejected'}">${c.active==='TRUE'||c.active===true?'نعم':'لا'}</span></td>
          <td class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="toggleCoupon('${c.id}', ${!(c.active==='TRUE'||c.active===true)})">${(c.active==='TRUE'||c.active===true)?'إيقاف':'تفعيل'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${c.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="6" class="empty">لا توجد أكواد بعد</td></tr>`}</tbody></table>
    </div>`;
  document.getElementById('couponSaveBtn').addEventListener('click', saveCoupon);
}
async function saveCoupon(){
  const btn = document.getElementById('couponSaveBtn');
  const code = document.getElementById('couponCode').value.trim().toUpperCase();
  if (!code){ toast('اكتب كود الخصم'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    await DB.create('Coupons', {
      discount_percent: Number(document.getElementById('couponDiscount').value)||10,
      course_id: document.getElementById('couponCourse').value || '',
      uses_left: Number(document.getElementById('couponUses').value)||50,
      active: 'TRUE',
    }, code);
    toast('تم الحفظ بنجاح'); renderCouponsTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
async function toggleCoupon(code, makeActive){
  try { await DB.update('Coupons', code, { active: makeActive?'TRUE':'FALSE' }); toast('تم التحديث'); renderCouponsTab(); } catch(e){ toast(friendlyError(e)); }
}
async function deleteCoupon(code){
  if (!confirm('حذف هذا الكود؟')) return;
  try { await DB.remove('Coupons', code); toast('تم الحذف'); renderCouponsTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   USERS (read-only + role toggle)
   ===================================================================== */
async function renderUsersTab(){
  const users = await DB.listAll('Users');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} المستخدمون</h1></div>
    <div class="panel">
      <table class="rows"><thead><tr><th></th><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>المستوى</th><th>الدور</th><th></th></tr></thead>
      <tbody>${users.length ? users.map(u=>`
        <tr>
          <td>${u.avatar_url?`<img class="thumb-sm" src="${escapeHtml(u.avatar_url)}">`:''}</td>
          <td>${escapeHtml(u.full_name||'')}</td>
          <td style="font-size:12.5px;">${escapeHtml(u.email||'')}</td>
          <td style="font-size:12.5px;">${escapeHtml(u.phone||'—')}</td>
          <td style="font-size:12.5px;">${escapeHtml(u.level||'—')}</td>
          <td><span class="badge ${u.role==='admin'?'approved':'pending'}">${u.role==='admin'?'أدمن':'طالب'}</span></td>
          <td class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="toggleAdmin('${u.id}', '${u.role==='admin'?'student':'admin'}')">${u.role==='admin'?'إلغاء الأدمن':'ترقية لأدمن'}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="7" class="empty">لا يوجد مستخدمون بعد</td></tr>`}</tbody></table>
    </div>`;
}
async function toggleAdmin(uid, role){
  try { await DB.update('Users', uid, { role }); toast('تم التحديث'); renderUsersTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   INIT
   ===================================================================== */
loadTab();
</script>
</body>
</html>
